[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "morphopreserve-dvi"
version = "1.0.0"
description = "Reproducible analysis of anthropometric compression loss and uncertainty-aware sex estimation for DVI."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name="Mohammad Amir Khusru Akhtar"}]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "streamlit>=1.36"
]

[project.scripts]
morphopreserve = "morphopreserve.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
